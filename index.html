<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090012">
<meta name="description" content="Rock Sales - todos os meus canais e redes sociais.">
<title>ROCK SALES | Links</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;background:#050008;color:#fff;display:flex;
  justify-content:center;overflow-x:hidden;
}
.page{
  width:100%;max-width:650px;min-height:100vh;position:relative;
  overflow:hidden;background:#090012;
}
.page::before{
  content:"";position:absolute;inset:0;
  background-image:url("rock-sales-bg.png");
  background-size:cover;background-position:center top;
  opacity:.42;filter:saturate(1.15);
}
.page::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(4,0,12,.94) 0%,rgba(8,0,18,.76) 42%,rgba(8,0,18,.28) 100%),
    linear-gradient(180deg,rgba(5,0,12,.12) 0%,rgba(5,0,12,.55) 72%,#050008 100%);
}
.content{
  position:relative;z-index:2;min-height:100vh;
  padding:42px 24px 32px;text-align:center;
}
.profile{
  width:104px;height:104px;margin:0 auto 14px;border-radius:50%;
  border:3px solid #a94cff;box-shadow:0 0 12px #a94cff,0 0 35px #6d19d9;
  background:url("rock-sales-bg.png") center 15%/cover no-repeat;
}
h1{
  margin:0 0 5px;font-size:39px;font-weight:900;letter-spacing:1px;
  text-shadow:0 0 10px #8b27ff,0 0 25px #5d13b8;
}
.handle{font-size:15px;color:#ddd;margin-bottom:10px}
.subtitle{
  font-size:12px;letter-spacing:3.5px;font-weight:800;
  margin-bottom:25px;text-shadow:0 0 8px #000;
}
.links{display:grid;gap:13px}
.link{
  min-height:66px;display:flex;align-items:center;padding:10px 18px;
  border-radius:17px;text-decoration:none;color:#fff;
  background:rgba(7,2,18,.86);border:2px solid rgba(255,255,255,.3);
  box-shadow:0 0 12px rgba(139,39,255,.28),inset 0 0 18px rgba(255,255,255,.03);
  backdrop-filter:blur(7px);transition:.18s ease;
}
.link:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 0 25px rgba(160,65,255,.65)}
.icon{
  width:48px;height:42px;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;flex:none
}
.text{flex:1;text-align:left}
.name{display:block;font-size:17px;font-weight:900;letter-spacing:1px}
.desc{display:block;font-size:13px;color:#d9a4ff;margin-top:3px}
.arrow{font-size:30px;margin-left:8px}
.twitch{border-color:#9147ff}.youtube{border-color:#ff3150}
.tiktok{border-color:#21dff0}.kwai{border-color:#ff981c}.facebook{border-color:#2684ff}
.bottom{
  margin-top:28px;font-size:12px;font-weight:800;letter-spacing:1px;
  line-height:2;text-shadow:0 2px 5px #000;
}
.thanks{
  margin-top:20px;color:#b64cff;font-size:20px;font-weight:900;
  font-style:italic;text-shadow:0 0 12px #7b1cff;
}
.footer{margin-top:18px;color:#aaa;font-size:11px}
@media(max-width:430px){
  .content{padding:30px 15px 25px}
  h1{font-size:32px}
  .subtitle{font-size:10px;letter-spacing:2.2px}
  .link{min-height:64px;padding:9px 12px}
}
</style>
</head>
