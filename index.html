<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Rock Sales - acompanhe todos os meus canais.">
  <title>Rock Sales | Links</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 50% 0%, #333 0, #151515 35%, #080808 75%);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    .avatar {
      width: 105px;
      height: 105px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2b2b, #ff7a00);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
      border: 4px solid #fff;
      box-shadow: 0 8px 30px rgba(0,0,0,.45);
    }
    h1 { font-size: 32px; margin-bottom: 8px; }
    .handle { color: #bbb; margin-bottom: 10px; font-size: 15px; }
    .bio { color: #eee; margin-bottom: 25px; line-height: 1.5; }
    .links { display: grid; gap: 14px; }
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 60px;
      padding: 15px 20px;
      border-radius: 15px;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(10px);
      transition: transform .18s, background .18s;
    }
    .link:hover {
      transform: translateY(-2px) scale(1.01);
      background: rgba(255,255,255,.18);
    }
    .icon {
      width: 30px;
      font-size: 23px;
    }
    .youtube { border-left: 5px solid #ff0000; }
    .tiktok { border-left: 5px solid #25f4ee; }
    .kwai { border-left: 5px solid #ff7a00; }
    .facebook { border-left: 5px solid #1877f2; }
    footer { margin-top: 28px; color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <main class="container">
    <div class="avatar">RS</div>
    <h1>ROCK SALES</h1>
    <div class="handle">@rocksales1911</div>
    <p class="bio">🔥 Me acompanhe em todas as minhas redes sociais 👇</p>

    <div class="links">
      <a class="link youtube"
         href="https://youtube.com/@rocksales1911?si=D4g_X0NzD3NbHB4y"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">▶️</span> YouTube
      </a>

      <a class="link tiktok"
         href="https://www.tiktok.com/@rocksales1911?_r=1&_t=ZS-99hpPVs2bcQ"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">🎵</span> TikTok
      </a>

      <a class="link kwai"
         href="https://k.kwai.com/u/@rocksales1911/CahGAdPf"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">🎬</span> Kwai
      </a>

      <a class="link facebook"
         href="https://www.facebook.com/share/1DchkqFNVL/"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">📘</span> Facebook
      </a>
    </div>

    <footer>© 2026 Rock Sales</footer>
  </main>
</body>
</html>
